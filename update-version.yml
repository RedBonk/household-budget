name: Update site build metadata

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "version.json"

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version.json
        shell: bash
        run: |
          APP_VERSION="$(tr -d '[:space:]' < APP_VERSION)"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          version = open('APP_VERSION', encoding='utf-8').read().strip()
          sha = os.environ['GITHUB_SHA']
          data = {
              'appVersion': version,
              'build': sha[:7],
              'commit': sha,
              'builtAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Commit build metadata
        shell: bash
        run: |
          if git diff --quiet -- version.json; then
            echo "No version change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update site build metadata [skip ci]"
          git push
